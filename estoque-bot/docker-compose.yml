# Evolution API (gateway de WhatsApp) + Postgres. O agente roda fora do Docker (uvicorn).
services:
  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: evolution-estoque
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      SERVER_URL: http://localhost:8080
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_estoque
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      WEBHOOK_GLOBAL_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN,INFO
    volumes:
      - ./evolution/instances:/evolution/instances
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: evolution-estoque-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - ./evolution/postgres:/var/lib/postgresql/data
